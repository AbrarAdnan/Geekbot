# Checks that run on the staged files at every `git commit` (lesson: project/learn/01-packaging.md §7).
# mypy and pytest are deliberately not hooks: they run manually and in CI.

# The golden-corpus documents are test data (D-032); the copied csv_analyst package and its tests
# stay as Gigalogy wrote them so a re-sync is a plain copy (C1). (The v1 files were removed in S4.4;
# the git tag v1.0 keeps them.)
exclude: |
  (?x)^(
      evals/corpus/.*
    | src/csv_analyst/.*
    | tests/csv_analyst/vendored/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep equal to the ruff pin in requirements/lock-win.txt, or the hook and `ruff check .`
    # can disagree.
    rev: v0.17.0
    hooks:
      # The linter runs first: its fixes can need reformatting.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
