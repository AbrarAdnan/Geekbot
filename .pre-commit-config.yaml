# Checks that run on the staged files at every `git commit` (lesson: project/learn/01-packaging.md §7).
# mypy and pytest are deliberately not hooks: they run manually and in CI.

# The v1 files and v1's README stay byte-for-byte untouched until step S4.4 removes them
# (D-029); the golden-corpus documents are test data (D-032).
exclude: |
  (?x)^(
      app\.py
    | rag_pipeline\.py
    | storage_utils\.py
    | get_embedding_function\.py
    | requirements\.txt
    | README\.md
    | evals/corpus/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep equal to the ruff pin in requirements/lock-win.txt, or the hook and `ruff check .`
    # can disagree.
    rev: v0.17.0
    hooks:
      # The linter runs first: its fixes can need reformatting.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
