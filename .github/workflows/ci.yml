# Continuous integration (lesson: project/learn/04-ci.md, step S0.5).
# Runs the same checks you run by hand (ruff, mypy, pytest) on GitHub's machines, on every
# pull request into v2 or main. Tests marked `live` need Ollama and a GPU, so they never run here
# (pyproject.toml deselects them by default).

name: CI

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2]

# The checks only read the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Your real setup: conda creates the env from environment.yml, which installs the
    # exact versions in requirements/lock-win.txt. If the lock or environment.yml is broken,
    # this job is the one that turns red.
    name: windows / py3.12 / lock
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: geekbot
          # environment.yml says `nodefaults`; this keeps the runner's setup the same.
          conda-remove-defaults: "true"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Import rules
        run: lint-imports
      - name: Tests
        run: pytest

  ubuntu:
    # ✍️ YOUR PIECE (step S0.5). Fresh resolution: install from the version RANGES in
    # pyproject.toml (not the lock), so a new upstream release that breaks us turns this red
    # before it surprises you. Replace the placeholder step below so that this job:
    #   - runs on `ubuntu-latest`
    #   - uses a matrix over Python "3.12" and "3.13" (strategy: matrix: python-version: [...])
    #     (quote the versions: unquoted, YAML reads 3.10 as the number 3.1)
    #   - steps: actions/checkout@v4, then actions/setup-python@v5 with
    #     python-version: ${{ matrix.python-version }}, then
    #     `python -m pip install -e ".[dev]"`, then the same four checks as the windows job
    #     (ruff check ., ruff format --check ., mypy src, pytest)
    # Mind the indentation: YAML uses spaces, never tabs, and children are indented under parents.
    name: ubuntu / fresh install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Import rules
        run: lint-imports
      - name: Tests
        run: pytest