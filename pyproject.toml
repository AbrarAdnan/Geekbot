# Geekbot v2 packaging and tool config (lesson: project/learn/01-packaging.md).
# Dependencies, extras and tool configs are added in the step that first uses them (D-035).

[build-system]
requires = ["hatchling>=1.27"]  # 1.27 added PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "geekbot"
version = "2.0.0.dev0"
description = "A local RAG engine that measures retrieval quality, controls inference cost, and treats retrieved content as untrusted data."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abrar Adnan" }]
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.13",  # the exclusive storage lock (S1.4)
    "httpx>=0.27",  # the Ollama HTTP client (S0.3)
    "pydantic-settings>=2.6",  # typed settings from GEEKBOT_* env vars and .env (S0.2)
    "typer>=0.15",  # the CLI (S0.2)
    # The copied csv_analyst package (C1, src/csv_analyst/VENDORED.md). Only what it imports
    # directly, with the lower bounds from its own pyproject.
    "charset-normalizer>=3.3",  # guessing a CSV's text encoding
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",  # parquet hand-off to its (unused) pandas sandbox
    "pydantic>=2.6",
    "pyyaml>=6.0",  # reading Gigalogy's questions.yaml in the C3 reproduction run
    "requests>=2.31",  # its Ollama provider; C2 replaces this with Geekbot's own
    "sqlglot>=30.0",  # parsing and checking the model's SQL
    # Loaders (S1.1). Each reads one family of formats.
    "markitdown[docx,pptx]>=0.1.3",  # Word, PowerPoint and HTML to Markdown (plugins stay off)
    "openpyxl>=3.1",  # Excel workbooks, read in streaming mode for the schema cards
    "pypdf[crypto]>=5.0",  # PDF text per page; [crypto] opens AES-protected files
    # The dense index (S1.5): Chroma stores vectors Geekbot computed itself and never embeds.
    "chromadb>=1.0",
    # The CPU cross-encoder reranker (S2.3). The package only; its model weights are downloaded
    # on first use, into the data folder, never at install time.
    "fastembed>=0.7",
    # The answer graph (S3.1): a fixed LangGraph state machine, LangChain's message types, and the
    # Ollama chat model. LangChain 1.x line (PLAN.md section 1); no agent loop, no `langchain` meta
    # package.
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langgraph>=1.0",
    # Conversation memory (S3.4): the SQLite checkpointer. Its async saver (aiosqlite underneath) is
    # the one PLAN.md section 6.3 names for the server; the command line uses it too.
    "langgraph-checkpoint-sqlite>=3.0",
    # The ablation's rung R0 (S2.6) rebuilds v1's chunking with the same splitter class v1 used.
    # v1 pinned 0.3.11, which needs langchain-core 0.3; the 1.x package is the same algorithm and
    # CP2's v1 reference run checks that the two cut the golden corpus identically.
    "langchain-text-splitters>=1.0",
    # The API server (S4.1): the one process that owns the storage (PLAN.md section 6.2).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # The browser UI (S4.4): an API client only (geekbot.ui; import-linter keeps it out of the
    # storage). Telemetry is switched off on the command line `geekbot up` builds.
    "streamlit>=1.45",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",  # property-based tests: the chunker's no-loss test (S1.2), IDs (S1.3)
    "import-linter>=2.0",  # the UI-never-imports-storage contract (S4.4); `lint-imports`
    "mcp>=2.3",  # the official MCP client, used only by tests/unit/test_mcp_sdk_client.py (S6.1); src never imports it
    "mypy>=2.4",
    "pip-tools>=7.6.1",  # first release that supports pip 26.2
    "pre-commit>=4.6",
    "pytest>=9.1",
    "python-docx>=1.1",  # builds the Word file the loader tests read (S1.1)
    "ruff>=0.16",  # the config below relies on ruff 0.16's default rule set
]

[project.scripts]
geekbot = "geekbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geekbot", "src/csv_analyst"]

[tool.ruff]
# The target Python version is read from requires-python.
line-length = 100
# pre-commit passes file names explicitly; this makes ruff apply the excludes to them too.
force-exclude = true
extend-exclude = [
    # Test documents for the golden corpus (D-032), not our code.
    "evals/corpus",
    # ruff >= 0.16 also formats Python blocks inside Markdown; notes keep snippets as written.
    "*.md",
    # The copied csv_analyst package and its tests stay byte-for-byte as Gigalogy wrote them,
    # so a re-sync is a plain copy (C1, src/csv_analyst/VENDORED.md).
    "src/csv_analyst",
    "tests/csv_analyst/vendored",
]

# No `select`: we use ruff 0.16's curated default rule set (~413 rules).
[tool.ruff.lint.per-file-ignores]
# Literal numbers in test assertions are clearer than named constants.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

# Typing debt (C1): the copied package was not written for mypy strict. Its errors are ignored;
# Geekbot's own code that calls it (src/geekbot/csv_mode, from C2) is still checked strictly.
[[tool.mypy.overrides]]
module = ["csv_analyst", "csv_analyst.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# tests/unit/evalkit.py holds the fakes several evaluation tests share (S2.6). With importlib mode
# a sibling file is not importable by itself, so the folder is put on the path.
pythonpath = ["tests/unit"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # Tests that need Ollama or the GPU only run when asked for: `pytest -m live`.
    "-m",
    "not live",
]
markers = ["live: needs a running Ollama and/or the GPU; deselected by default"]
# The UI client (S4.4) gives its requests a timeout; Starlette's TestClient, which the UI tests
# use in place of a real connection, warns about that argument on every call. A real
# `httpx.Client` accepts it, so the warning is about the test double only.
filterwarnings = ["ignore:You should not use the 'timeout' argument with the TestClient"]

# `lint-imports` (CI and PLAN.md section 14). PLAN.md section 6.2: the UI is a client of the one
# process that owns the storage, so nothing under geekbot.ui may import the storage, ingest,
# retrieval, agent, llm, server or CSV packages, or the heavy libraries behind them. Indirect
# imports count: a UI module that imports a helper which imports Chroma is a violation too. The UI
# may use geekbot.apikey, geekbot.config and geekbot.sse, which import none of those.
[tool.importlinter]
root_packages = ["geekbot", "csv_analyst"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The UI is an API client and never imports the storage or the server"
type = "forbidden"
source_modules = ["geekbot.ui"]
forbidden_modules = [
    "geekbot.index",
    "geekbot.ingest",
    "geekbot.retrieval",
    "geekbot.agent",
    "geekbot.llm",
    "geekbot.server",
    "geekbot.csv_mode",
    "geekbot.evals",
    "geekbot.doctor",
    "geekbot.cli",
    "csv_analyst",
    "chromadb",
    "langgraph",
    "langchain_core",
    "langchain_ollama",
    "fastapi",
    "uvicorn",
]

# PLAN.md section 6.7 (C5): the vendored csv_analyst package is reached only through
# geekbot.csv_mode, so its pandas types, its settings and its quirks stay behind one door. Only direct
# imports count here (allow_indirect_imports): geekbot.csv_mode itself imports the package, so every
# module that imports csv_mode would otherwise "import it indirectly". Every package of geekbot other
# than csv_mode is listed; tests/unit/test_csv_import_boundary.py reads the imports of all files, so
# a package added later and forgotten in this list is still caught there.
[[tool.importlinter.contracts]]
name = "Only geekbot.csv_mode imports the csv_analyst package"
type = "forbidden"
source_modules = [
    "geekbot.agent",
    "geekbot.apikey",
    "geekbot.cli",
    "geekbot.config",
    "geekbot.doctor",
    "geekbot.domain",
    "geekbot.evals",
    "geekbot.fsutil",
    "geekbot.index",
    "geekbot.ingest",
    "geekbot.labelling",
    "geekbot.llm",
    "geekbot.log",
    "geekbot.retrieval",
    "geekbot.server",
    "geekbot.sse",
    "geekbot.swapcheck",
    "geekbot.ui",
]
forbidden_modules = ["csv_analyst"]
allow_indirect_imports = true
